# ---- 0.3 domestic fast path (evaluated before every overseas rule set) ----
# Literal-IP destinations carry no domain, so none of the DOMAIN-SUFFIX rules
# below can match them. WeChat dials its servers by IP (157.148.x.x), which used
# to fall through to the USER-AGENT sub-rules in WeChat.list; matching on
# User-Agent forces Surge to buffer and parse the HTTP request header before it
# can pick a policy, measured at 8.7ms p50 versus 0.8ms for a plain list hit.
# `no-resolve` keeps this rule confined to destinations that are already IPs, so
# domain-based routing (AI, YouTube, Google) is untouched no matter how early it
# sits.
GEOIP,CN,DIRECT,no-resolve
# ChinaMax.list ships almost no domain rules upstream, so without these the
# common domestic apps only match through GEOIP,CN, which forces a DNS
# resolution before Surge can pick a policy. Matching by domain keeps WeChat,
